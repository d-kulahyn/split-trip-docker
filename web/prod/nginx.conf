user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    # Avatars are capped at 5 MB by the API; the rest is multipart overhead.
    client_max_body_size 6m;

    # Docker's embedded DNS. The API is resolved per request, so nginx starts
    # (and keeps serving the ACME challenge) while the API container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Socket.IO upgrades to WebSocket on the same path as its polling
    # requests; plain requests keep a pooled upstream connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # A request for any other host name (an IP scan, a stale DNS record) is
    # dropped: the API answers only for its own domain.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf;
}
