# Everything — /api, /socket.io, /.well-known, the deep-link pages — is the
# Nest API's. The variable makes nginx resolve the container per request.
set $nest_upstream http://split_trip_nest:3000;
proxy_pass $nest_upstream;

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host $host;
# Overwritten, not appended: the API trusts exactly one hop (TRUST_PROXY_HOPS=1),
# so a client-sent X-Forwarded-For never reaches it as a rate-limit key.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Above Socket.IO's 25 s ping interval, so an idle socket is not cut.
proxy_read_timeout 75s;
